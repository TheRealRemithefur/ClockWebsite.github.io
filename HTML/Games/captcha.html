<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="../IMAGES/favicon.gif" type="image/x-icon" />
<title>Image CAPTCHA Online</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    background: #121212;
    color: #ddd;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #captcha-container {
    background: #1e1e1e;
    padding: 2em;
    border-radius: 10px;
    box-shadow: 0 0 20px #00e5ff88;
    width: 440px;
    text-align: center;
  }
  .images-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 1em;
  }
  .image-option {
    width: 120px;
    height: 120px;
    border: 3px solid transparent;
    border-radius: 8px;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    cursor: pointer;
    transition: border-color 0.3s;
  }
  .image-option.selected {
    border-color: #00e5ff;
  }
  button {
    padding: 0.7em 1.5em;
    border: none;
    border-radius: 6px;
    background: #00e5ff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #00b8cc;
    color: #fff;
  }
  #message {
    margin-top: 1em;
    font-weight: 600;
    color: #f55;
  }
</style>
</head>
<body>

<div id="captcha-container">
  <h2>Select the Stop Sign</h2>
  <div class="images-grid" id="imagesGrid"></div>
  <button id="submitBtn">Submit</button>
  <div id="message"></div>
</div>

<script>
  const maxFails = 3;
  let failCount = 0;
  let selectedIndex = null;

  const images = [
    { name: 'Yield', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Yield_sign.svg/120px-Yield_sign.svg.png', correct: false },
    { name: 'Stop', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Stop_sign_light_red.svg/120px-Stop_sign_light_red.svg.png', correct: true },
    { name: 'Speed Limit 50', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Swiss_traffic_sign_3.31.svg/120px-Swiss_traffic_sign_3.31.svg.png', correct: false },
    { name: 'No Entry', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/No_entry_sign.svg/120px-No_entry_sign.svg.png', correct: false },
    { name: 'Yield (copy)', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Yield_sign.svg/120px-Yield_sign.svg.png', correct: false },
    { name: 'No Entry (copy)', url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/No_entry_sign.svg/120px-No_entry_sign.svg.png', correct: false }
  ];

  const imagesGrid = document.getElementById('imagesGrid');
  const submitBtn = document.getElementById('submitBtn');
  const message = document.getElementById('message');

  function loadImages() {
    imagesGrid.innerHTML = '';
    images.forEach((imgObj, idx) => {
      const div = document.createElement('div');
      div.classList.add('image-option');
      div.style.backgroundImage = `url(${imgObj.url})`;
      div.title = imgObj.name;
      div.dataset.idx = idx;
      div.addEventListener('click', () => {
        document.querySelectorAll('.image-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        selectedIndex = idx;
        message.textContent = '';
      });
      imagesGrid.appendChild(div);
    });
  }

  submitBtn.addEventListener('click', () => {
    if(selectedIndex === null){
      message.textContent = 'Please select an image.';
      return;
    }
    if(images[selectedIndex].correct){
      message.style.color = '#0f0';
      message.textContent = 'Correct! You are human.';
      submitBtn.disabled = true;
      // Add your next step here if any
    } else {
      failCount++;
      message.style.color = '#f55';
      message.textContent = `Wrong selection! Attempts: ${failCount} / ${maxFails}`;
      if(failCount >= maxFails){
        alert('Too many failed attempts. Redirecting to Blue Screen...');
        // Correct relative path from Games folder to EasterEggs folder
        window.location.href = 'EasterEggs/Windows-Fake-Hack.html';
      }
    }
  });

  loadImages();
</script>

</body>
</html>
